  max_retries: 2

strategy:
  type: synthetic_gen
  synthetic_gen_system_prompt_path: "src/datagen/strategies/prompts/cities_synthetic/question_system_prompt.txt"
  synthetic_gen_user_prompt_path: "src/datagen/strategies/prompts/cities_synthetic/question_user_prompt.txt"
  task_system_prompt_path: "src/data/prompts/cities_easy/brad_magic_on_top_shayan_finesse.txt"
  chat_mode: true
  memory_adapter:
    type: history_list
    checkpoint_path: "/scratch/m000122/stalaei/logs/continual_learning/outputs/stalaei_cities_easy/history_agent/easy_synth_cities_40_25_l8b_non_collapsed_full_action/20251103_105556/checkpoints/ep_000500/memory_500.jsonl"
  num_generations: 20000
  num_experiences_subsample_per_task_generation: 20
  use_task_generation_experiences_for_solving: false
  shuffle_experiences_when_solving: false
  num_threads: 512
  lm_config:
    model: "toka:meta-llama/Llama-3.1-8B-Instruct"
    base_url: "http://localhost:8096"
    train_temperature: 0.7
    val_temperature: 1.0
    max_output_tokens: 2048
    max_retries: 2

