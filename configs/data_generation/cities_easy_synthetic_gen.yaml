output_format: jsonl

num_threads: 512
num_repeat_samples: 1
save_individual_files: true
include_teacher_messages_texts: true
metadata:
  project: continual-learning
  task: cities_easy

llm:
  model: toka:meta-llama/Llama-3.1-8B-Instruct
  base_url: http://localhost:8096
  train_temperature: 0.0
  val_temperature: 0.0
  max_output_tokens: 2048
