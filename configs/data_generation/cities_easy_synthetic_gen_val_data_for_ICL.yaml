# Config for generating synthetic city QA data using the history-agent checkpoint
# Set mode to `questions_only`, `answers_only`, or `full` depending on the stage.
output_dir: "/projects/bfsg/stalaei/logs/continual_learning/data/cities_easy_synthetic_gen_l8b_chatboxed_question_gen-1to50_from_100_val_data_answer_gen-same_as_question_gen_shuffled_student_messages_teacher_context_2500"
