# Example config for src.datagen.generate (ReplayStrategy)
output_dir: "/scratch/m000122/stalaei/logs/continual_learning/data/finer_synthetic_gen"
output_format: jsonl

num_threads: 4
num_repeat_samples: 1
save_individual_files: true
include_teacher_messages_texts: true
metadata:
  project: continual-learning

llm:
  model: toka:meta-llama/Llama-3.1-8B-Instruct
  base_url: http://localhost:8096
  train_temperature: 0.0
  val_temperature: 0.0
  max_output_tokens: 2048
  top_logprobs: 20
  max_retries: 2

strategy:
  type: synthetic_gen
  synthetic_gen_system_prompt_path: "src/datagen/strategies/prompts/synthetic_gen/question_system_prompt.txt"
  synthetic_gen_user_prompt_path: "src/datagen/strategies/prompts/synthetic_gen/question_user_prompt.txt"
  task_system_prompt_path: "src/data/prompts/finer/system_prompt_brad_magic.txt"
  memory_adapter:
    checkpoint_path: "/scratch/m000122/stalaei/logs/continual_learning/outputs/finer/history_agent/brad_magic_with_progressive_fewshots/20251020_111212/checkpoints/ep_000250/memory_250.jsonl"
    type: history_list
  num_generations: 50000
  num_threads: 64
  lm_config:
    model: "toka:meta-llama/Llama-3.1-8B-Instruct"
    base_url: "http://localhost:8096"
    train_temperature: 0.7
    val_temperature: 1.0
    max_output_tokens: 2048
    max_retries: 2
