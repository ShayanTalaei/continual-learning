runtime:
  max_envs_to_visit: 750
  max_steps_per_episode: 300
  verbose: true
  scores_path: scores.jsonl

train_dataset:
  type: appworld
  root: third_party/appworld
  dataset_name: "test_normal"  # choose a valid dataset name under appworld data
  num_episodes: 2
  max_steps: 300
  # prompts_path: "third_party/appworld/experiments/prompts/react_code_agent/instructions.txt"
  prompts_path: "src/data/prompts/appworld/agent_prompt.txt"
  experiment_name: continual_learning/cuga/test_normal_qwen

agent:
  type: appworld_cuga
  verbose: true
  memory_config:
    _type: history_list
    max_length: 600
  history_k: 300
  lm_config:
    # Small chat model to minimize VRAM; adjust if you prefer another tiny chat model
    model: vllm:Qwen/Qwen3-8B
    # model: vllm:mistralai/Mistral-7B-Instruct-v0.3
    temperature: 0.0
    max_output_tokens: 20000
    log_calls: true
    shared_model: true

    use_server: false
    base_url: http://localhost:8000
    protocol: openai
    api_key: null
    timeout_s: 900.0

    # Conservative vLLM settings for low memory usage
    trust_remote_code: true
    gpu_memory_utilization: 0.5
    dtype: "bfloat16"
    max_model_len: 20000
    strip_think_tags: true
    tensor_parallel_size: 1

  # Sub-component configurations
  planner_config:
    planning_enabled: true
    replan_on_failure: true
    max_planning_steps: 10
    memory_config:
      _type: history_list
      max_length: 400
    history_k: 300
    lm_config:
      # Small chat model to minimize VRAM; adjust if you prefer another tiny chat model
      model: vllm:Qwen/Qwen3-8B
      # model: vllm:mistralai/Mistral-7B-Instruct-v0.3
      temperature: 0.0
      max_output_tokens: 20000
      log_calls: true
      shared_model: true

      use_server: false
      base_url: http://localhost:8000
      protocol: openai
      api_key: null
      timeout_s: 900.0

      # Conservative vLLM settings for low memory usage
      trust_remote_code: true
      gpu_memory_utilization: 0.5
      dtype: "bfloat16"
      max_model_len: 20000
      strip_think_tags: true
      tensor_parallel_size: 1

  code_planner_config:
    memory_config:
      _type: history_list
      max_length: 400
    history_k: 300
    lm_config:
      # Small chat model to minimize VRAM; adjust if you prefer another tiny chat model
      model: vllm:Qwen/Qwen3-8B
      # model: vllm:mistralai/Mistral-7B-Instruct-v0.3
      temperature: 0.0
      max_output_tokens: 8092
      log_calls: true
      shared_model: true

      use_server: false
      base_url: http://localhost:8000
      protocol: openai
      api_key: null
      timeout_s: 900.0

      # Conservative vLLM settings for low memory usage
      trust_remote_code: true
      gpu_memory_utilization: 0.5
      dtype: "bfloat16"
      max_model_len: 15000
      strip_think_tags: true
      tensor_parallel_size: 1

  code_agent_config:
    enable_reflection: true
    memory_config:
      _type: history_list
      max_length: 600
    history_k: 300
    lm_config:
      # Small chat model to minimize VRAM; adjust if you prefer another tiny chat model
      model: vllm:Qwen/Qwen3-8B
      # model: vllm:mistralai/Mistral-7B-Instruct-v0.3
      temperature: 0.0
      max_output_tokens: 20000
      log_calls: true
      shared_model: true

      use_server: false
      base_url: http://localhost:8000
      protocol: openai
      api_key: null
      timeout_s: 900.0

      # Conservative vLLM settings for low memory usage
      trust_remote_code: true
      gpu_memory_utilization: 0.5
      dtype: "bfloat16"
      max_model_len: 20000
      strip_think_tags: true
      tensor_parallel_size: 1

  # Coordination configuration
  coordination_enabled: true
  max_coordination_steps: 50
  enable_reflection_feedback: true

output:
  results_dir: outputs/appworld_generalist
  log_level: INFO
