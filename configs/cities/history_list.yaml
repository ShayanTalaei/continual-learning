## FinLoRA Finer — HistoryAgent on local JSONL test set

runtime:
  max_envs_to_visit: 500
  max_steps_per_episode: 1
  scores_path: scores.jsonl
  run_validation_at_start: true
  validation_num_workers: 200
  validation_freq: 5
  # Checkpointing
  checkpoint_dir: checkpoints
  checkpoint_every_episodes: 50
  # Use one of the following strategies:
  # - last_n: keeps the last N checkpoints saved every `checkpoint_every_episodes`
  # - top_k_val: keeps the top-K checkpoints by validation mean score (saved on validation)
  checkpoint_strategy: last_n
  checkpoint_keep_last: 20
  checkpoint_on_start: false
  # start_episode_index: 250
  # resume_from: "/scratch/m000122/stalaei/logs/continual_learning/outputs/cities/history_agent/synth_cities_gemini_flash/20251027_182112/checkpoints/ep_000250"

train_dataset:
  type: qa
  hf_name: "stalaei/synth_cities"
  split: "train"
  question_field: "question"
  answer_field: "country"
  id_field: "id"
  instruction_template: null
  max_samples: 500
  shuffle: false

validation_dataset:
  type: qa
  hf_name: "stalaei/synth_cities"
  split: "val"
  question_field: "question"
  answer_field: "country"
  id_field: "id"
  instruction_template: null
  max_samples: 500
  shuffle: false

agent:
  type: history_agent
  lm_config:
    # Use provider-prefixed model to dispatch to Tokasaurus
    # model: "toka:meta-llama/Llama-3.1-8B-Instruct"
    model: "toka:meta-llama/Llama-3.2-3B-Instruct"
    # model: "toka:meta-llama/Llama-3.1-70B-Instruct"
    train_temperature: 0.3
    val_temperature: 0.0
    max_output_tokens: 2048
    log_calls: true
    # Tokasaurus-specific fields (present on TokasaurusConfig)
    base_url: "http://localhost:8096"
    stop_sequences: ["FEEDBACK", "OBSERVATION"]
    max_retries: 3
  memory_config:
    _type: history_list
    max_length: null
  history_k: null
  system_prompt: "{file:src/data/prompts/cities/system_prompt_brad_magicer.txt}"

output:
  results_dir: outputs/cities/history_agent/synth_cities_toka_llama_3.2_3b
  log_level: INFO


